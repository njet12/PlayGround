<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07101d"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='25' fill='%235bf4ed'/%3E%3C/svg%3E"><title>NEON RUNNER — 3D Arena</title>
<style>
:root{color-scheme:dark;--cyan:#5bf4ed;--gold:#ffcf6a;--ink:#07101d;--panel:rgba(7,16,29,.78)}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#f4fbff}canvas{display:block;position:fixed;inset:0;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2;padding:clamp(14px,3vw,30px);display:flex;flex-direction:column;justify-content:space-between}.hud-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:.2em;font-size:12px;color:#a8bed1}.brand b{color:var(--cyan)}.stats{display:flex;gap:9px}.stat{min-width:94px;padding:11px 15px;border:1px solid #7690a32a;border-radius:14px;background:var(--panel);backdrop-filter:blur(14px);box-shadow:0 10px 36px #0002}.stat label{display:block;font-size:9px;letter-spacing:.19em;color:#8da3b7;font-weight:800}.stat strong{font-size:23px;line-height:1.35;letter-spacing:.03em}.stat.score strong{color:var(--gold)}.stat.time strong{color:var(--cyan)}.bottom-row{display:flex;justify-content:space-between;align-items:flex-end}.hint{font-size:11px;letter-spacing:.08em;color:#b1c2d0;text-shadow:0 2px 6px #000}.hint b{color:white}.lives{color:#ff6574;letter-spacing:5px;font-size:16px}.overlay{position:fixed;z-index:5;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at center,rgba(7,16,29,.38),rgba(4,9,18,.82));backdrop-filter:blur(5px);transition:opacity .25s,visibility .25s}.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.card{width:min(490px,100%);padding:clamp(26px,6vw,48px);text-align:center;border:1px solid #b2e8ff2b;border-radius:26px;background:linear-gradient(145deg,rgba(18,37,56,.92),rgba(7,16,29,.94));box-shadow:0 30px 100px #0008,0 0 70px #49eee514;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:0 15% auto;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.29em;color:var(--cyan);margin-bottom:13px}.card h1{font-size:clamp(38px,9vw,66px);line-height:.95;letter-spacing:-.055em;margin:0 0 16px}.card h1 span{color:var(--cyan)}.card p{color:#a6bacb;font-size:14px;line-height:1.7;margin:0 auto 25px;max-width:350px}.card .result{font-size:22px;font-weight:800;color:var(--gold);margin:-7px 0 20px}.button{pointer-events:auto;border:0;border-radius:12px;padding:15px 25px;background:var(--cyan);color:#061316;font:900 12px inherit;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 30px #5bf4ed32;transition:transform .15s,filter .15s}.button:hover{transform:translateY(-2px);filter:brightness(1.08)}.button:active{transform:translateY(1px)}.small-note{font-size:10px!important;letter-spacing:.08em;margin:16px 0 0!important;color:#6f8498!important}.touch-controls{position:fixed;z-index:3;inset:auto 0 14px;display:none;justify-content:space-between;padding:0 20px;pointer-events:none}.touch-btn{width:68px;height:68px;border:1px solid #a6ffff55;border-radius:50%;background:#1026399c;color:#d9ffff;font-size:27px;pointer-events:auto;touch-action:none;user-select:none;display:grid;place-items:center;box-shadow:0 4px 24px #0004}.touch-pad{width:140px;height:140px;position:relative;pointer-events:auto;touch-action:none}.stick{width:56px;height:56px;position:absolute;left:42px;top:42px;border-radius:50%;background:#5bf4ed88;border:1px solid #cfffff88;box-shadow:0 0 26px #5bf4ed55;pointer-events:none}.pause{pointer-events:auto;border:1px solid #9db8ce44;background:#0a1a2a99;color:#e8faff;border-radius:10px;padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer}.hud-top .right{display:flex;align-items:center;gap:10px}.toast{position:fixed;z-index:3;top:95px;left:50%;transform:translateX(-50%);padding:10px 16px;border:1px solid #5bf4ed55;background:#07101dcc;border-radius:20px;color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:.12em;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:600px){#hud{padding:14px}.brand{font-size:9px}.stat{min-width:72px;padding:8px 10px;border-radius:11px}.stat label{font-size:8px}.stat strong{font-size:18px}.bottom-row .hint{display:none}.touch-controls{display:flex}.card{border-radius:22px}.card p{font-size:13px}.touch-pad{width:120px;height:120px}.stick{left:32px;top:32px}.touch-btn{width:60px;height:60px;margin-top:30px}}
</style></head><body>
<div id="hud"><div class="hud-top"><div class="brand">NEON<b> / </b>RUNNER <span style="color:#5bf4ed">●</span></div><div class="right"><div class="stats"><div class="stat score"><label>SHARDS</label><strong id="score">000</strong></div><div class="stat time"><label>TIME</label><strong id="timer">60</strong></div></div><button id="pause" class="pause" aria-label="Pause game">Ⅱ</button></div></div><div class="bottom-row"><div class="hint"><b>WASD</b> / <b>ARROWS</b> MOVE &nbsp;·&nbsp; <b>SPACE</b> DASH &nbsp;·&nbsp; <b>ESC</b> PAUSE</div><div class="lives" id="lives">♥ ♥ ♥</div></div></div>
